app.name=MySparkApp
app.master=local[*]
producer.input.path=data/source
producer.output.path=data/input
producer.frequency = 1
producer.batch = 640
producer.loop = true
producer.recursive = true
debug = false

consumer.input.path=data/input
consumer.output.path=data/output
consumer.checkpoint.path=data/checkpoint
consumer.model.path=models/final_CNN.onnx
consumer.model.input.width=64
consumer.model.input.height=64
consumer.model.input.channels=1
consumer.model.classes=biodegradable,cardboard,glass,metal,paper,plastic
consumer.trigger.interval=1
consumer.file.glob=*.{jpg,jpeg,png}
consumer.enable.prediction=true
consumer.extract.label.from.path=true